name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  core:
    timeout-minutes: 20
    name: Core and terminal (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test --summary all
        working-directory: core
      - run: zig build --summary all
        working-directory: core
      # The core for each Linux target and mode: the mock library needs libc in Debug and Safe builds.
      - name: Cross-compile the core for Linux
        run: |
          for target in x86_64-linux-gnu aarch64-linux-gnu x86_64-linux-musl aarch64-linux-musl; do
            for mode in Debug ReleaseSafe; do
              zig build -Dtarget=$target -Doptimize=$mode --summary failures
            done
          done
        working-directory: core
      - run: zig build test --summary all
        working-directory: tui
      - run: zig build --summary all
        working-directory: tui

  gnome:
    timeout-minutes: 30
    name: GNOME (Fedora)
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - run: >
          dnf -y install git tar xz gtk4-devel libadwaita-devel
          libsecret-devel
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test --summary all
        working-directory: core
      - run: zig build --summary all
        working-directory: gnome

  apple:
    timeout-minutes: 45
    name: Apple (macOS, iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: sh apple/build-core.sh
      - name: Build for macOS
        run: >
          xcodebuild -project apple/Biblio.xcodeproj
          -scheme Biblio -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build for the iOS Simulator
        run: >
          xcodebuild -project apple/Biblio.xcodeproj
          -scheme Biblio
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  android:
    timeout-minutes: 45
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test --summary all
        working-directory: android/native
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: gradle assembleDebug
        working-directory: android

  windows:
    timeout-minutes: 45
    name: Windows (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64, runner: windows-latest }
          - { platform: ARM64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -p:Platform=${{ matrix.platform }}
        working-directory: windows/Biblio
